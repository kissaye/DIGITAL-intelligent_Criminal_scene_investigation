<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>html,body,#potree_render_area{margin:0;width:100%;height:100%;background:#101827;color:#d7e5f6;font:14px Arial}.notice{display:grid;place-items:center;height:100%;text-align:center;line-height:1.7}.notice b{color:#fff}</style></head><body><div id="potree_render_area"><div class="notice" id="notice">正在准备 Potree Viewer…</div></div><script>
const send=(type,p={})=>parent.postMessage({source:'dici-potree',type,...p},location.origin); const mock=new URLSearchParams(location.search).get('mock')==='1'; let viewer;
function notice(t){document.getElementById('potree_render_area').innerHTML='<div class="notice">'+t+'</div>'}
function boot(){if(mock){notice('<div><b>模拟 Viewer 模式</b><br>不会伪造或加载真实点云。可演示工作台数据操作。</div>');send('loaded');return} const css=document.createElement('link');css.rel='stylesheet';css.href='https://cdn.jsdelivr.net/gh/potree/potree@1.8/build/potree/potree.css';document.head.appendChild(css);const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/gh/potree/potree@1.8/build/potree/potree.js';s.onload=()=>send('ready');s.onerror=()=>{notice('Potree 资源加载失败，请检查网络或部署本地 Potree 静态资源。');send('error',{message:'Potree 静态资源不可用'})};document.head.appendChild(s)}
function load(manifestUrl){if(!window.Potree){send('error',{message:'Potree 尚未完成初始化'});return} document.getElementById('potree_render_area').innerHTML='';viewer=new Potree.Viewer(document.getElementById('potree_render_area'));viewer.setEDLEnabled(true);viewer.setFOV(60);viewer.setPointBudget(1500000);Potree.loadPointCloud(manifestUrl,'scene',e=>{if(!e.pointcloud){send('error',{message:'点云清单加载失败'});return}viewer.scene.addPointCloud(e.pointcloud);viewer.fitToScreen();send('loaded');setInterval(()=>send('camera',{camera:{position:viewer.scene.view.position.toArray(),target:viewer.scene.view.getPivot().toArray()}}),1000)})}
function xyz(v){return{x:v.x,y:v.y,z:v.z}}function pointTool(){if(mock){send('pick',{point:{x:0,y:0,z:0}});return}if(!viewer)return;const m=viewer.measuringTool.startInsertion({showCoordinates:true,maxMarkers:1,name:'Point Mark'});m.addEventListener('marker_added',()=>{if(m.points?.[0])send('pick',{point:xyz(m.points[0].position)})})}function measureTool(){if(!viewer)return;const m=viewer.measuringTool.startInsertion({showDistances:true,maxMarkers:2,name:'Distance'});m.addEventListener('marker_added',()=>{if(m.points?.length===2)send('measurement',{startPoint:xyz(m.points[0].position),endPoint:xyz(m.points[1].position)})})}function areaTool(){if(!viewer)return;const handler=e=>{const v=e.volume;if(!v)return;send('area',{area:{center:[v.position.x,v.position.y,v.position.z],size:[v.scale.x,v.scale.y,v.scale.z],rotation:[v.rotation.x,v.rotation.y,v.rotation.z]}});viewer.volumeTool.removeEventListener('volume_added',handler)};viewer.volumeTool.addEventListener('volume_added',handler);viewer.volumeTool.startInsertion({clip:true})}window.addEventListener('message',e=>{if(e.origin!==location.origin||e.data?.source!=='dici-parent')return; if(e.data.type==='load')load(e.data.manifestUrl); if(e.data.type==='load-mock')boot(); if(e.data.type==='reset'&&viewer)viewer.fitToScreen(); if(e.data.type==='pick-point')pointTool(); if(e.data.type==='measure')measureTool(); if(e.data.type==='area')areaTool()});boot();
</script></body></html>
