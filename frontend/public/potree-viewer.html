<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<link rel="stylesheet" href="/vendor/potree/build/potree/potree.css">
<link rel="stylesheet" href="/vendor/potree/libs/jquery-ui/jquery-ui.min.css">
<link rel="stylesheet" href="/vendor/potree/libs/openlayers3/ol.css">
<link rel="stylesheet" href="/vendor/potree/libs/spectrum/spectrum.css">
<link rel="stylesheet" href="/vendor/potree/libs/jstree/themes/mixed/style.css">
<style>html,body,#potree_render_area{margin:0;width:100%;height:100%;background:#101827;color:#d7e5f6;font:14px Arial}.notice{display:grid;place-items:center;height:100%;text-align:center;line-height:1.7}</style></head><body><div id="potree_render_area"><div class="notice">正在准备 Potree Viewer…</div></div>
<script src="/vendor/potree/libs/jquery/jquery-3.1.1.min.js"></script>
<script src="/vendor/potree/libs/spectrum/spectrum.js"></script>
<script src="/vendor/potree/libs/jquery-ui/jquery-ui.min.js"></script>
<script src="/vendor/potree/libs/other/BinaryHeap.js"></script>
<script src="/vendor/potree/libs/tween/tween.min.js"></script>
<script src="/vendor/potree/libs/d3/d3.js"></script>
<script src="/vendor/potree/libs/proj4/proj4.js"></script>
<script src="/vendor/potree/libs/openlayers3/ol.js"></script>
<script src="/vendor/potree/libs/i18next/i18next.js"></script>
<script src="/vendor/potree/libs/jstree/jstree.js"></script>
<script src="/vendor/potree/build/potree/potree.js"></script>
<script src="/vendor/potree/libs/plasio/js/laslaz.js"></script>
<script src="/polygon-measurement.js"></script>
<script src="/two-point-measurement.js"></script>
<script>
const send=(type,p={})=>parent.postMessage({source:'dici-potree',type,...p},location.origin),mock=new URLSearchParams(location.search).get('mock')==='1';let viewer,maskVolumes=[],highlightVolume;
function notice(t){document.getElementById('potree_render_area').innerHTML='<div class="notice">'+t+'</div>'}function boot(){if(mock){notice('模拟 Viewer 模式<br>不会伪造或加载真实点云。');send('loaded');return}if(window.Potree)send('ready');else{notice('Potree 本地资源加载失败');send('error',{message:'Potree 本地静态资源不可用'})}}
function load(url){measurementSession?.cancel();if(!window.Potree)return send('error',{message:'Potree 尚未完成初始化'});document.getElementById('potree_render_area').innerHTML='';viewer=new Potree.Viewer(document.getElementById('potree_render_area'));viewer.setEDLEnabled(true);viewer.setPointBudget(1500000);Potree.loadPointCloud(url,'scene',e=>{if(!e.pointcloud)return send('error',{message:'点云清单加载失败'});viewer.scene.addPointCloud(e.pointcloud);viewer.fitToScreen();send('loaded')})}
function highlight(rule){
  if(mock){
    document.getElementById('mock-highlight')?.remove();
    if(!rule)return;
    const box=document.createElement('div');
    box.id='mock-highlight';box.dataset.mode=rule.type;
    box.textContent='模拟区域 · '+rule.type+' · '+rule.title;
    Object.assign(box.style,{position:'absolute',inset:'28% 34% 26% 14%',border:'2px solid '+(rule.type==='DELETE'?'#f47171':'#e6a23c'),padding:'12px',pointerEvents:'none'});
    document.body.append(box);return;
  }
  if(!viewer)return;
  if(highlightVolume){viewer.scene.removeVolume(highlightVolume);highlightVolume=undefined}
  if(!rule)return;
  const {min,max}=rule.range;
  const box=new Potree.BoxVolume();
  box.name=rule.title;box.clip=false;box.modifiable=false;
  box.position.set(...min.map((value,i)=>(value+max[i])/2));
  box.scale.set(...min.map((value,i)=>max[i]-value));
  box.material.color.set(rule.type==='DELETE'?0xf47171:0xe6a23c);
  box.material.opacity=.3;viewer.scene.addVolume(box);highlightVolume=box;
}
function masks(items){if(mock){
  document.querySelectorAll('[data-mock-forced-hide]').forEach(node=>node.remove());
  items.filter(item=>item.enforced&&item.type==='HIDE').forEach((item,index)=>{
    const box=document.createElement('div');box.dataset.mockForcedHide=item.id;
    box.textContent='模拟强制 HIDE · '+item.title;
    Object.assign(box.style,{position:'absolute',top:(23+index*6)+'%',left:'8%',width:'42%',height:'26%',border:'2px solid #e6a23c',background:'#332615',color:'#ffd18b',padding:'8px',pointerEvents:'none'});
    document.body.append(box);
  });return;
}if(!viewer)return;maskVolumes.forEach(v=>viewer.scene.removeVolume(v));maskVolumes=[];items.filter(x=>x.type==='HIDE').forEach(x=>{const a=x.range.min,b=x.range.max,v=new Potree.BoxVolume();v.name=x.title||'教学强制遮挡';v.position.set((a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2);v.scale.set(Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1]),Math.abs(b[2]-a[2]));v.clip=true;v.material.opacity=.28;v.material.color.set(0xe6a23c);viewer.scene.addVolume(v);maskVolumes.push(v)});if(maskVolumes.length){viewer.setClipTask(Potree.ClipTask.SHOW_OUTSIDE);if(Potree.ClipMethod)viewer.setClipMethod(Potree.ClipMethod.INSIDE_ANY)}else viewer.setClipTask(Potree.ClipTask.NONE)}
function xyz(v){return{x:v.x,y:v.y,z:v.z}}
function pick(){
  polygonSession?.cancel();
  measurementSession?.cancel();
  if(mock){send('pick',{point:{x:0,y:0,z:0}});return send('tool-status',{message:'已选取模拟点位'})}
  if(!viewer)return;
  send('tool-status',{message:'请在点云中单击选取点位'});
  const measurement=viewer.measuringTool.startInsertion({showCoordinates:true,maxMarkers:1});
  let completed=false;
  measurement.addEventListener('marker_dropped',event=>{
    if(completed||event.index!==0||!measurement.points?.[0])return;
    completed=true;
    send('pick',{point:xyz(measurement.points[0].position)});
    send('tool-status',{message:'点位已选取'});
  });
}
let measurementSession,polygonSession;
function polygon(){measurementSession?.cancel();polygonSession?.cancel();if(mock){send('tool-status',{message:'模拟区域：3个示例顶点，未执行真实拾取'});send('polygon',{points:[{x:0,y:0,z:0},{x:3,y:0,z:0},{x:3,y:4,z:0}]});return}if(!viewer)return;polygonSession=createPolygonMeasurement({viewer,Potree,status:message=>send('tool-status',{message}),complete:result=>send('polygon',result)});polygonSession.begin()}
function measure(){
  polygonSession?.cancel();
  if(mock){send('measurement',{startPoint:{x:1,y:2,z:3},endPoint:{x:4,y:6,z:3}});return send('tool-status',{message:'模拟测距已完成'})}
  if(!viewer)return;
  measurementSession?.cancel();
  measurementSession = createTwoPointMeasurement({
    viewer, Potree,
    status: message => send('tool-status',{message}),
    complete: points => send('measurement',points),
  });
  measurementSession.begin();
}
function area(){polygonSession?.cancel();measurementSession?.cancel();if(!viewer)return;let h=e=>{let v=e.volume;if(v)send('area',{area:{center:[v.position.x,v.position.y,v.position.z],size:[v.scale.x,v.scale.y,v.scale.z],rotation:[v.rotation.x,v.rotation.y,v.rotation.z]}});viewer.volumeTool.removeEventListener('volume_added',h)};viewer.volumeTool.addEventListener('volume_added',h);viewer.volumeTool.startInsertion({clip:true})}
addEventListener('message',e=>{if(e.origin!==location.origin||e.data?.source!=='dici-parent')return;let d=e.data;if(d.type==='load')load(d.manifestUrl);if(d.type==='load-mock')boot();if(d.type==='set-desensitization-masks'){masks(d.masks||[]);highlight(d.selectedRule)};if(d.type==='reset'&&viewer)viewer.fitToScreen();if(d.type==='pick-point')pick();if(d.type==='measure')measure();if(d.type==='polygon')polygon();if(d.type==='polygon-cancel')polygonSession?.cancel();if(d.type==='polygon-saving')polygonSession?.saving();if(d.type==='polygon-saved')polygonSession?.saved();if(d.type==='polygon-failed')polygonSession?.failed();if(d.type==='area')area()});window.addEventListener('pagehide',()=>measurementSession?.cancel());boot();
</script></body></html>
