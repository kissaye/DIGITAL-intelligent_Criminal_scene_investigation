<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>html,body,#potree_render_area{margin:0;width:100%;height:100%;background:#101827;color:#d7e5f6;font:14px Arial}.notice{display:grid;place-items:center;height:100%;text-align:center;line-height:1.7}</style></head><body><div id="potree_render_area"><div class="notice">正在准备 Potree Viewer…</div></div><script>
const send=(type,p={})=>parent.postMessage({source:'dici-potree',type,...p},location.origin),mock=new URLSearchParams(location.search).get('mock')==='1';let viewer,maskVolumes=[];
function notice(t){document.getElementById('potree_render_area').innerHTML='<div class="notice">'+t+'</div>'}function boot(){if(mock){notice('模拟 Viewer 模式<br>不会伪造或加载真实点云。');send('loaded');return}let c=document.createElement('link');c.rel='stylesheet';c.href='https://cdn.jsdelivr.net/gh/potree/potree@1.8/build/potree/potree.css';document.head.appendChild(c);let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/gh/potree/potree@1.8/build/potree/potree.js';s.onload=()=>send('ready');s.onerror=()=>{notice('Potree 资源加载失败');send('error',{message:'Potree 静态资源不可用'})};document.head.appendChild(s)}
function load(url){if(!window.Potree)return send('error',{message:'Potree 尚未完成初始化'});document.getElementById('potree_render_area').innerHTML='';viewer=new Potree.Viewer(document.getElementById('potree_render_area'));viewer.setEDLEnabled(true);viewer.setPointBudget(1500000);Potree.loadPointCloud(url,'scene',e=>{if(!e.pointcloud)return send('error',{message:'点云清单加载失败'});viewer.scene.addPointCloud(e.pointcloud);viewer.fitToScreen();send('loaded')})}
function masks(items){if(!viewer)return;maskVolumes.forEach(v=>viewer.scene.removeVolume(v));maskVolumes=[];items.filter(x=>x.type==='HIDE').forEach(x=>{const a=x.range.min,b=x.range.max,v=new Potree.BoxVolume();v.name=x.title||'教学强制遮挡';v.position.set((a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2);v.scale.set(Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1]),Math.abs(b[2]-a[2]));v.clip=true;v.material.opacity=.28;v.material.color.set(0xe6a23c);viewer.scene.addVolume(v);maskVolumes.push(v)});if(maskVolumes.length){viewer.setClipTask(Potree.ClipTask.SHOW_OUTSIDE);if(Potree.ClipMethod)viewer.setClipMethod(Potree.ClipMethod.INSIDE_ANY)}else viewer.setClipTask(Potree.ClipTask.NONE)}
function xyz(v){return{x:v.x,y:v.y,z:v.z}}function pick(){if(mock)return send('pick',{point:{x:0,y:0,z:0}});if(!viewer)return;let m=viewer.measuringTool.startInsertion({showCoordinates:true,maxMarkers:1});m.addEventListener('marker_added',()=>m.points?.[0]&&send('pick',{point:xyz(m.points[0].position)}))}function measure(){if(!viewer)return;let m=viewer.measuringTool.startInsertion({showDistances:true,maxMarkers:2});m.addEventListener('marker_added',()=>m.points?.length===2&&send('measurement',{startPoint:xyz(m.points[0].position),endPoint:xyz(m.points[1].position)}))}function area(){if(!viewer)return;let h=e=>{let v=e.volume;if(v)send('area',{area:{center:[v.position.x,v.position.y,v.position.z],size:[v.scale.x,v.scale.y,v.scale.z],rotation:[v.rotation.x,v.rotation.y,v.rotation.z]}});viewer.volumeTool.removeEventListener('volume_added',h)};viewer.volumeTool.addEventListener('volume_added',h);viewer.volumeTool.startInsertion({clip:true})}
addEventListener('message',e=>{if(e.origin!==location.origin||e.data?.source!=='dici-parent')return;let d=e.data;if(d.type==='load')load(d.manifestUrl);if(d.type==='load-mock')boot();if(d.type==='set-desensitization-masks')masks(d.masks||[]);if(d.type==='reset'&&viewer)viewer.fitToScreen();if(d.type==='pick-point')pick();if(d.type==='measure')measure();if(d.type==='area')area()});boot();
</script></body></html>
