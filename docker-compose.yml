name: scene-pointcloud
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: criminal_scene
      POSTGRES_USER: criminal_scene
      POSTGRES_PASSWORD: criminal_scene_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U criminal_scene -d criminal_scene"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  migrate:
    build:
      context: ./backend
    image: scene-pointcloud-backend:m7
    command: sh -c "alembic upgrade head && python -m app.seed"
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://criminal_scene:criminal_scene_dev@db:5432/criminal_scene
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /app/storage
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-docker-development-only-change-before-deployment}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      PDAL_PATH: /opt/conda/bin/pdal
      POTREE_CONVERTER_PATH: /usr/local/bin/PotreeConverter
      RQ_QUEUE_NAME: pointcloud
    depends_on:
      db:
        condition: service_healthy
  backend:
    build:
      context: ./backend
    image: scene-pointcloud-backend:m7
    ports:
      - "127.0.0.1:8000:8000"
    environment: *backend-env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
    volumes:
      - case_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  worker:
    build:
      context: ./backend
    image: scene-pointcloud-backend:m7
    command: rq worker --url redis://redis:6379/0 --name pointcloud-worker pointcloud
    environment: *backend-env
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker_health"]
      interval: 15s
      timeout: 5s
      retries: 10
    volumes:
      - case_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
        VITE_USE_MOCK: "false"
    ports:
      - "5173:80"
    depends_on:
      - backend
volumes:
  postgres_data:
  case_storage:
